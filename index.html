<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALORIUM | Luxury Fragrances & Oud</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-deep: #0a0a0a;
            --bg-card: #141414;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border-color: rgba(212, 175, 55, 0.2);
            --transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        h1, h2, h3, .serif-font {
            font-family: 'Playfair Display', serif;
        }

        /* Sticky Luxury Header */
        header {
            position: sticky;
            top: 0;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 6%;
            transition: var(--transition);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 5px;
            text-decoration: none;
            text-transform: uppercase;
            font-family: 'Playfair Display', serif;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 35px;
        }

        nav a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s ease;
            position: relative;
        }

        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -5px;
            left: 0;
            background-color: var(--gold);
            transition: width 0.3s ease;
        }

        nav a:hover {
            color: var(--gold);
        }

        nav a:hover::after {
            width: 100%;
        }

        /* Hero Section */
        .hero {
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            background: linear-gradient(rgba(10, 10, 10, 0.6), rgba(10, 10, 10, 0.85)), url('bg-luxury.jpg') no-repeat center center/cover;
            position: relative;
            animation: fadeIn 1.5s ease;
        }

        .hero h1 {
            font-size: 4.2rem;
            color: var(--gold-light);
            margin-bottom: 20px;
            letter-spacing: 5px;
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .hero p {
            font-size: 1.1rem;
            color: #d1d1d1;
            max-width: 650px;
            margin-bottom: 35px;
            letter-spacing: 1.5px;
            font-weight: 300;
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .btn-luxury {
            background: transparent;
            color: #fff;
            padding: 16px 40px;
            border: 1px solid var(--gold);
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 500;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .btn-luxury::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--gold);
            transition: transform 0.4s ease;
            z-index: -1;
        }

        .btn-luxury:hover {
            color: #000;
            border-color: var(--gold);
        }

        .btn-luxury:hover::before {
            transform: translateX(100%);
        }

        /* Section Layout */
        .section {
            padding: 120px 6%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 2.8rem;
            color: var(--gold);
            margin-bottom: 12px;
            letter-spacing: 3px;
            font-family: 'Playfair Display', serif;
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-muted);
