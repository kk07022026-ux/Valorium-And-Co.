
<script>
(() => {
    const phoneNo = "918982687911";

    const $ = (id) => document.getElementById(id);

    const productImg = $("productImg");
    const productTitle = $("productTitle");
    const priceBox = $("priceBoxContainer");
    const offerCard = $("offerCardContainer");
    const offerText = $("offerText");
    const savingsText = $("savingsText");
    const productDesc = $("productDesc");
    const waButton = $("waButton");
    const miniOfferWaBtn = $("miniOfferWaBtn");
    const prevBtn = $("prevBtn");
    const nextBtn = $("nextBtn");
    const imageBox = $("imageBox");
    const indicators = document.querySelectorAll(".indicator");

    const products = [
        {
            name: "French Oud Blanc (10ml)",
            volume: "10 ml",
            price: 149,
            original: 199,
            offerTotal: 298,
            savings: 149,
            type: "price",
            img: "10mll.png",
            desc: "Discover French-inspired White Oud with a smooth, elegant aroma and a versatile unisex fragrance experience."
        },
        {
            name: "French Oud Blanc (30ml)",
            volume: "30 ml",
            price: 269,
            original: 349,
            offerTotal: 538,
            savings: 269,
            type: "price",
            img: "30mll.png",
            desc: "Experience French-inspired White Oud in a generous size, designed for an elegant and refreshing everyday fragrance experience."
        },
        {
            name: "French Oud Blanc (50ml Royale)",
            volume: "50 ml",
            type: "coming-soon",
            img: "50mll.png",
            desc: "Meet the upcoming Royale edition of French Oud Blanc. Contact us on WhatsApp for launch updates."
        }
    ];

    let currentIndex = 0;
    let startX = 0;
    let startY = 0;

    // Open WhatsApp with a pre-filled message.
    // The customer must press Send themselves.
    function openWhatsApp(message) {
        const url =
            "https://wa.me/" + phoneNo +
            "?text=" + encodeURIComponent(message);

        window.open(url, "_blank");
    }

    function getOrderMessage(product) {
        return [
            "Hello Valorium & Co. 👋",
            "",
            "I want to order French Oud Blanc.",
            "Variant: " + product.volume,
            "Price: ₹" + product.price,
            "",
            "Please confirm availability, delivery charges and payment details.",
            "",
            "Thank you!"
        ].join("\n");
    }

    function getOfferMessage(product) {
        return [
            "Hello Valorium & Co. 👋",
            "",
            "I want to claim your BUY 2 GET 1 FREE offer.",
            "Product: French Oud Blanc (" + product.volume + ")",
            "Quantity: 3 bottles",
            "Offer total: ₹" + product.offerTotal,
            "Saving: ₹" + product.savings,
            "",
            "Please confirm availability, delivery charges and payment details.",
            "",
            "Thank you!"
        ].join("\n");
    }

    function updateProductView() {
        const product = products[currentIndex];

        productTitle.textContent = product.name;
        productDesc.textContent = product.desc;
        productImg.alt = product.name;
        productImg.src = product.img;

        // Reset the image animation when the product changes.
        productImg.classList.remove(
            "slide-out-left",
            "slide-out-right"
        );

        if (product.type === "coming-soon") {
            priceBox.innerHTML =
                '<span class="coming-soon-text">Coming Soon</span>';

            offerCard.style.display = "none";
            waButton.innerHTML =
                '<i class="fab fa-whatsapp"></i> Get Launch Updates';

        } else {
            priceBox.innerHTML = `
                <span class="original-price">
                    ₹${product.original}
                </span>
                <span class="discount-badge">
                    Special Price
                </span>
                <span class="current-price">
                    ₹${product.price}/-
                </span>
            `;

            offerCard.style.display = "block";

            offerText.textContent =
                `BUY 2 GET 1 FREE (Get 3 Bottles @ ₹${product.offerTotal}/-)`;

            savingsText.innerHTML =
                `<i class="fas fa-check-circle"></i> Total Saving: ₹${product.savings}`;

            waButton.innerHTML =
                '<i class="fab fa-whatsapp"></i> Order via WhatsApp';
        }

        // Update carousel indicators.
        indicators.forEach((dot, index) => {
            dot.classList.toggle("active", index === currentIndex);
            dot.setAttribute(
                "aria-current",
                index === currentIndex ? "true" : "false"
            );
        });
    }

    function changeProduct(direction) {
        currentIndex =
            (currentIndex + direction + products.length) %
            products.length;

        updateProductView();
    }

    // Previous and next arrows.
    prevBtn.addEventListener("click", () => changeProduct(-1));
    nextBtn.addEventListener("click", () => changeProduct(1));

    // Click any indicator to open its product.
    indicators.forEach((dot, index) => {
        dot.style.cursor = "pointer";

        dot.addEventListener("click", () => {
            currentIndex = index;
            updateProductView();
        });
    });

    // Touch swipe for mobile.
    imageBox.addEventListener("touchstart", (event) => {
        if (event.touches.length !== 1) return;

        startX = event.touches[0].clientX;
        startY = event.touches[0].clientY;
    }, { passive: true });

    imageBox.addEventListener("touchend", (event) => {
        if (event.changedTouches.length !== 1) return;

        const endX = event.changedTouches[0].clientX;
        const endY = event.changedTouches[0].clientY;
        const diffX = endX - startX;
        const diffY = endY - startY;

        // Ignore vertical scrolling and tiny movements.
        if (Math.abs(diffX) < 45 ||
            Math.abs(diffX) < Math.abs(diffY)) {
            return;
        }

        changeProduct(diffX < 0 ? 1 : -1);
    }, { passive: true });

    // Desktop mouse drag support.
    let mouseStartX = 0;
    let isDragging = false;

    imageBox.addEventListener("mousedown", (event) => {
        mouseStartX = event.clientX;
        isDragging = true;
    });

    imageBox.addEventListener("mouseup", (event) => {
        if (!isDragging) return;
        isDragging = false;

        const diffX = event.clientX - mouseStartX;

        if (Math.abs(diffX) >= 50) {
            changeProduct(diffX < 0 ? 1 : -1);
        }
    });

    imageBox.addEventListener("mouseleave", () => {
        isDragging = false;
    });

    // Main WhatsApp order / launch enquiry button.
    waButton.addEventListener("click", () => {
        const product = products[currentIndex];

        if (product.type === "coming-soon") {
            openWhatsApp(
                "Hello Valorium & Co. 👋\n\n" +
                "I am interested in French Oud Blanc Royale (50ml).\n" +
                "Please notify me when it launches."
            );
            return;
        }

        openWhatsApp(getOrderMessage(product));
    });

    // Claim offer button.
    miniOfferWaBtn.addEventListener("click", () => {
        const product = products[currentIndex];

        if (product.type === "coming-soon") return;

        openWhatsApp(getOfferMessage(product));
    });

    // Initial display.
    updateProductView();
})();
</script>
